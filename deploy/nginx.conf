# /etc/nginx/sites-available/ipa-backend
# Then: ln -s ../sites-available/ipa-backend /etc/nginx/sites-enabled/
#       certbot --nginx -d api.yourdomain.com
server {
    listen 80;
    server_name api.yourdomain.com;

    # Big enough for drone videos; keep in step with MAX_UPLOAD_MB.
    client_max_body_size 1024m;

    # Serve photos and videos straight from disk (fast, supports video seeking).
    # Change the path to wherever DATA_DIR points.
    location /media/ {
        alias /opt/ipa-backend/data/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads: stream them to the backend and allow time for processing.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
